id: "01-algorithms-and-binary"
title: "Алгоритми з розгалуженням та двійкове кодування"
subjectId: "informatics"
gradeId: "grade-05"
description: "Ознайомлення з блок-схемами, таблицею трасування змінних та переведенням чисел у біти."
speaker: "Програміст Квітка"
speakerAvatar: "🤖"
islandStageName: "Лабораторія коду"

blocks:
  - id: "inf-01-dialogue"
    type: "block_dialogue"
    speaker: "Програміст Квітка"
    avatar: "🤖"
    emote: "idea"
    text: "Привіт! Комп'ютер не вгадує наміри — він чітко виконує команди крок за кроком і зберігає дані у нулях та одиницях."

  - id: "inf-02-theory"
    type: "block_theory_rule"
    title: "Блок-схема, трасування та 8 бітів"
    ruleSummary: |
      Коли в алгоритмі є перевірка умови, виникає **розгалуження**. Хід виконання зручно відстежувати у таблиці трасування:

      {{flow:steps="Старт|Умова x > 3?|Так: y = x * 2|Вивід y"}}

      {{algorithm_trace:vars="x = 4";steps="x = x + 3:x = 7|y = x * 2:y = 14|Вивід y:14"}}

      У пам'яті числа зберігаються бітами (натискайте на біти у прикладі, щоб дослідити вагу кожного розряду):
      {{binary_bits:value=13}}

      Приклад перетворення в алгоритмі-машині: {{machine:in=5;factor=3;add=2}}
    formulaText: "1 байт = 8 біт  |  13₁₀ = 8 + 4 + 1 = 00001101₂"
    codeLanguage: "python"
    codeSnippet: |
      x = 4
      if x > 3:
          x = x + 3
      y = x * 2
      print(y)
    stepByStepBreakdown:
      - "Стежте за поточним значенням кожної змінної рядок за рядком."
      - "У двійковому записі кожен розряд справа наліво має вагу 1, 2, 4, 8, 16, 32, 64, 128."
    copilotHint: "Клікніть по кнопках бітів у віджеті вище, щоб побачити, як 0 і 1 утворюють десяткове число."

  - id: "inf-03-quiz"
    type: "block_recognition_quiz"
    question: "Яке число у десятковій системі відповідає двійковому запису 00001010₂ (одиниці у розрядах 8 та 2)?"
    options:
      - text: "10"
        isCorrect: true
        feedbackSuccess: "Правильно! 8 + 2 = 10."
      - text: "6"
        isCorrect: false
        feedbackFail: "6 = 4 + 2, тобто одиниці стояли б у четвертому й другому справа розрядах (00000110)."
      - text: "12"
        isCorrect: false
        feedbackFail: "12 = 8 + 4, а в нашому числі замість 4 стоїть одиниця у розряді 2."
    explanation: "Додаємо ваги позицій, де стоїть біт «1»: 8 + 2 = 10."

  - id: "inf-04-trace-boss"
    type: "block_boss_challenge"
    title: "Фінальне трасування алгоритму"
    vars:
      startVal: "randInt(3, 8)"
      stepAdd: "randInt(2, 5)"
      finalRes: "(startVal + stepAdd) * 2"
    notebookPrompt: |
      Виконайте трасування алгоритму для початкового значення **x = {{startVal}}**:
      1) `x = x + {{stepAdd}}`
      2) `y = x * 2`

      Чому дорівнює результат **y** після завершення?
    unit: ""
    correctAnswer: "{{finalRes}}"
    hint: "Спочатку обчисліть {{startVal}} + {{stepAdd}}, а потім помножте суму на 2."
    copilotHint: "Не поспішайте: виконайте додавання в першому рядку, і лише потім множення у другому."
