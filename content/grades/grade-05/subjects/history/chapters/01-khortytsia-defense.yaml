blocks:
  - id: "hist-01-fact"
    type: "fact"
    title: "Історичний контекст: Перший козацький замок"
    text: |
      [[thesis:У 1556 році волинський князь Дмитро Вишневецький (Байда) збудував на острові Мала Хортиця перше дерево-земляне укріплення — прототип Запорозької Січі.]] Засіка контролювала дніпровські переправи й стримувала набіги.

      {{timeline:events="1556:Заснування Січі|січ. 1557:24-денна облога|осінь 1557:Велика облога"}}

      {{arg_map:title="Чому саме острів Мала Хортиця?";thesis="Мала Хортиця (1556) була стратегічно найвигіднішим рубежем для заснування першого козацького замку";evidence="Природний захист стрімких скель і річки Дніпро|Контроль переправ і торгівельних шляхів на південь";counter="Осінньої пори 1557 р. острів легко блокувати при браку боєприпасів та провіанту";conclusion="Тому перша засіка довела силу острівної оборони й започаткувала традицію Запорозької Січі"}}

      {{deep_dive:title="Козацька артилерія XVI століття";body="Фальконети на Хортиці стріляли свинцевими або залізними ядрами вагою 0.5–2 кг на відстань до 700 метрів. Кут піднесення ствола та пороховий заряд визначали точність при річковому вітрі."}}
    speaker: "Дмитро Вишневецький (Байда)"
    speakerAvatar: "⚔️"
    hints:
      - question: "Хто очолив будівництво першого замочного укріплення на Малій Хортиці у 1556 році?"
        correctAnswer: "Дмитро Вишневецький (Байда)"
        explanation: "Князь Дмитро Вишневецький об'єднав козацькі загони та звів Хортицький замок."

  - id: "hist-02-dialogue"
    type: "dialogue"
    title: "Тривожний сигнал на переправі"
    text: "Козаки! На обрії дніпровська флотилія хана Девлет-Ґерая. У січні 1557 року ми мусимо втримати облогу 24 дні. Розрахуйте кут фальконета й силу порохового заряду!"
    speaker: "Джура Тарас"
    speakerAvatar: "🏹"
    emote: "idea"

  - id: "khortytsia-cannon-task"
    type: "interactive_engine"
    engineId: "ballistic-trajectory"
    title: "Відбиття річкового штурму Хортиці (1557)"
    copilotHint: "Для дальності 440–630 м спробуйте кут близько 40–45° та підберіть початкову швидкість із урахуванням вітру 3.5 м/с."
    reactionZones:
      - condition: "hit"
        speaker: "Дмитро Вишневецький (Байда)"
        avatar: "⚔️"
        emote: "joy"
        text: "Влучний залп! Гармати Хортиці тримають дніпровський рубіж!"
      - condition: "near_miss"
        speaker: "Джура Тарас"
        avatar: "🏹"
        emote: "idea"
        text: "Зовсім поруч! Відхилення незначне — підкоригуйте кут на 2–3° або заряд на кілька м/с."
      - condition: "undershoot"
        speaker: "Джура Тарас"
        avatar: "🏹"
        emote: "sweat"
        text: "Недоліт — ядро впало у воду перед галерою. Додайте порохового заряду або наблизьте кут до 45°."
