id: "01-rhythm-and-pentatonic-melody"
title: "Ритм, такт і пентатоніка: живий слуховий тренажер"
subjectId: "music"
gradeId: "grade-05"
description: "Відчуття сильної та слабкої долі такту, музичні паузи та побудова мелодії на слух у пентатоніці."
speaker: "Диригент Соломія"
speakerAvatar: "🎼"
islandStageName: "Звукова майстерня"

blocks:
  - id: "mus-01-dialogue"
    type: "block_dialogue"
    speaker: "Диригент Соломія"
    avatar: "🎼"
    emote: "idea"
    text: "Вітаю у Звуковій майстерні! Уся музика тримається на двох опорах: ритмічному пульсі (чергуванні сильних і легких доль) та висоті звуків. Сьогодні ми відчуємо ритм і складемо власну мелодію на слух."

  - id: "mus-02-theory"
    type: "block_theory_rule"
    title: "Пульс такту та ланцюжок пентатоніки"
    ruleSummary: |
      [[thesis:Сильна доля (● ТУК) відкриває такт, легка доля (▲ ТА) підтримує рух, а пауза (𝄽) дає музиці подих.]]

      Спробуйте змінити темп на живій схемі такту:
      {{music_rhythm:pattern="2|1|0|1";bpm=96}}
    formulaText: "Пентатоніка (5 ступенів): До — Ре — Мі — Соль — Ля — До5"
    stepByStepBreakdown:
      - "Пентатоніка звучить гармонійно у будь-якому поєднанні нот і є основою давніх народних мелодій."
      - "Темп вимірюється в ударах за хвилину (BPM): 60–80 — повільний, 84–112 — помірний, 116+ — жвавий."

  - id: "mus-03-melody"
    type: "block_interactive_sandbox"
    engineId: "music-sequencer-ear"
    instruction: "Послухайте всю мелодію або окремі ноти зразка («🔊 #1»–«🔊 #4»), порівнюйте зі звукорядом і підберіть кожну ноту по порядку."
    engineConfig:
      mode: "ear_melody"
      difficulty: "beginner"
      title: "Слуховий диктант · Початковий рівень (Пентатоніка)"
      scale: "pentatonic"
      tempoBpm: 92
      targetNotes: ["До", "Мі", "Соль", "До5"]
      successMessage: "Чудовий музичний слух! Ви точно впізнали висхідний рух по тризвуку до верхньої тоніки До5."

  - id: "mus-04-rhythm"
    type: "block_interactive_sandbox"
    engineId: "music-sequencer-ear"
    instruction: "Зберіть ритмічний малюнок такту: 1-ша доля — сильна (● ТУК), 2-га — легка (▲ ТА), 3-тя — пауза (𝄽), 4-та — легка (▲ ТА)."
    engineConfig:
      mode: "rhythm_grid"
      title: "Ритмічна сітка 4/4"
      tempoBpm: 96
      timeSignature: "4/4"
      beats: 4
      targetPattern: ["strong", "weak", "rest", "weak"]
      successMessage: "Ритм тримається рівно й точно! Пауза на третій долі створює виразний подих такту."

  - id: "mus-05-quiz"
    type: "block_recognition_quiz"
    multiSelect: true
    question: "Оберіть УСІ правильні твердження про музичний ритм і пентатоніку:"
    explanation: "Сильна доля задає опору такту, пауза є частиною музичного часу, а пентатоніка містить 5 різних ступенів."
    copilotHint: "Пригадайте будову такту на схемі вище та кількість основних звуків у пентатоніці."
    options:
      - text: "Сильна доля (акцент) найчастіше припадає на першу долю такту"
        isCorrect: true
        feedbackSuccess: "Правильно! Саме з неї починається відлік кожного такту."
      - text: "Музична пауза (𝄽) — це також частина тривалості такту"
        isCorrect: true
        feedbackSuccess: "Точно! Тиша в музиці рахується так само чітко, як і звучання."
      - text: "Пентатоніка складається з 12 хроматичних півтонів"
        isCorrect: false
        feedbackFail: "Ні, «пента» означає п’ять: До, Ре, Мі, Соль, Ля."

  - id: "mus-06-pause"
    type: "block_somatic_pause"
    activityId: "vocal_humming"
    durationSec: 20
    guideVoiceText: "Зробіть спокійний вдих і м’яко проспівайте на видиху рівний звук «м-м-м», відчуваючи легку вібрацію в грудях."
