id: "01-syntax-and-morphemes"
title: "Головні та другорядні члени речення. Будова слова"
subjectId: "ukrainian"
gradeId: "grade-05"
description: "Визначення граматичної основи, другорядних членів речення з різними підкресленнями та розбір слова за будовою."
speaker: "Мовознавиця Софія"
speakerAvatar: "🦉"
islandStageName: "Словарна вежа"

blocks:
  - id: "ukr-01-dialogue"
    type: "block_dialogue"
    speaker: "Мовознавиця Софія"
    avatar: "🦉"
    emote: "idea"
    text: |
      Вітаю у Словниковій вежі! Щоб думка звучала чітко й переконливо, кожне слово в реченні виконує свою роль.

      {{tree:root="Члени речення";children="Підмет|Присудок|Означення|Додаток|Обставина"}}

  - id: "ukr-02-theory"
    type: "block_theory_rule"
    title: "Члени речення та морфемний склад"
    ruleSummary: |
      [[thesis:Підмет і присудок утворюють граматичну основу речення, а означення, додаток і обставина пояснюють їх.]]

      Розглянемо зразок із подвійним візуальним кодуванням (форма лінії працює навіть у Ч/Б режимі):
      «[[attr:Сонячний]] [[subj:ранок]] [[adv:тихо]] [[pred:будить]] [[obj:місто]].»

      Перевіряємо орфограму: [[ortho:з[е/и]мовий]] (перевірне слово — «зи́ми»). Будову слова видно на схемі:
      {{morpheme_builder:parts="prefix:при|root:кордон|suffix:н|ending:ий"}}

      {{before_after:title="Редагування речення: До та Після";beforeLabel="До (нечітко)";afterLabel="Після (точно)";beforeText="Холодно будить місто.";afterText="[[attr:Сонячний]] [[subj:ранок]] [[adv:тихо]] [[pred:будить]] [[obj:місто]].";beforeMeta="без підмета й означення";afterMeta="повна граматична основа"}}

      [[quote:Хто ясно мислить, той ясно й висловлюється.]]
    formulaText: "Підмет (═) + Присудок (══)  |  Означення (∿) · Додаток (--) · Обставина (·-·)"
    stepByStepBreakdown:
      - "Спершу знайдіть дію (що робить? — присудок) і виконавця дії (хто/що? — підмет)."
      - "Далі поставте питання від головних слів до означення (який?), додатка (кого? що?) та обставини (як? де?)."
    copilotHint: "Зверніть увагу на різні форми підкреслень: хвиляста, пунктир, штрих-пунктир легко читаються в будь-якій темі."

  - id: "ukr-03-marking"
    type: "block_text_marking"
    title: "Практикум: розбір речення"
    prompt: "Оберіть інструмент угорі та позначте у реченні всі 5 членів речення (відкладена перевірка після натискання кнопки «Перевірити»):"
    sentence: "[[attr:Мудрі]] [[subj:козаки]] [[adv:надійно]] [[pred:боронили]] [[obj:фортецю]]."
    availableTools:
      - "subj"
      - "pred"
      - "attr"
      - "obj"
      - "adv"
    toleranceMode: "exact"
    explanation: "«Козаки» (хто?) — підмет; «боронили» (що робили?) — присудок; «Мудрі» (які?) — означення; «надійно» (як?) — обставина; «фортецю» (що?) — додаток."
    copilotHint: "Під час розставлення позначок колір не підказує правильність завчасно — спершу розмітьте все речення, а потім натисніть «Перевірити»."

  - id: "ukr-03b-morpheme-marking"
    type: "block_text_marking"
    title: "Практикум: розбір слова за морфемами"
    prompt: "Обирайте інструменти (Префікс, Корінь, Суфікс, Закінчення) й клікайте по окремих частинках усередині слова «прикордонний»:"
    sentence: "[[morpheme_parts:prefix:при|root:кордон|suffix:н|ending:ий]]"
    availableTools:
      - "prefix"
      - "root"
      - "suffix"
      - "ending"
    toleranceMode: "exact"
    explanation: "Слово «прикордонний» складається з префікса при-, кореня -кордон-, суфікса -н- та закінчення -ий."
    copilotHint: "Можна клікати на кожну морфему окремо, не виходячи за межі одного слова."

  - id: "ukr-04-quiz"
    type: "block_recognition_quiz"
    question: "У якому слові правильно виділено префікс і корінь, як у слові «прикордонний»?"
    options:
      - text: "Префікс при-, корінь -кордон-"
        isCorrect: true
        feedbackSuccess: "Точно! Споріднені слова «кордон», «закордонний» підтверджують корінь -кордон-."
      - text: "Префікс прик-, корінь -ордон-"
        isCorrect: false
        feedbackFail: "Доберіть спільнокореневе слово «кордон» — літера «к» належить до кореня."
      - text: "Префікс п-, корінь -рикордон-"
        isCorrect: false
        feedbackFail: "У слові «прикордонний» префікс «при-» означає наближення чи перебування біля чогось."
    explanation: "Основа перевіряється добором спільнокореневих слів: кордон → прикордонний."

  - id: "ukr-05-somatic"
    type: "block_somatic_pause"
    activityId: "vowel_sound_flow"
    durationSec: 20
    guideVoiceText: "Розслабте плечі, зробіть спокійний вдих і плавно протягніть чисті голосні: А — О — У — Е — И — І."
    copilotHint: "Плавне звучання голосних допомагає зняти напругу голосу та повернути концентрацію."
