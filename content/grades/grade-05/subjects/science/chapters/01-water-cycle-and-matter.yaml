id: "01-water-cycle-and-matter"
title: "Кругообіг води та будова речовини"
subjectId: "science"
gradeId: "grade-05"
description: "Дослідження станів води в природі, зв'язку живої й неживої природи та моделей атомів."
speaker: "Ботанік Мирослава"
speakerAvatar: "🌿"
islandStageName: "Ботанічна оранжерея"

blocks:
  - id: "sci-01-fact"
    type: "block_anchor_fact"
    headline: "Вода на нашій планеті"
    locationLabel: "Гідросфера"
    contentSummary: |
      Вода вкриває близько 71% поверхні Землі, а суходіл — лише 29%. Погляньте на це співвідношення на схемі частин і цілого та у дробах:

      {{split:total=100;left=71}} {{fraction:num=3;den=4;mode="bar"}}

      {{deep_dive:title="Чому крига не тоне у воді?";body="При замерзанні молекули води утворюють кришталеву решітку з більшими проміжками, тому лід легший за рідку воду і вкриває водойми зверху, рятуючи риб узимку."}}

  - id: "sci-02-theory"
    type: "block_theory_rule"
    title: "Кругообіг води, жива природа і молекули"
    ruleSummary: |
      Під дією Сонця вода безперервно переходить з одного стану в інший, утворюючи замкнутий цикл:
      {{cycle_diagram:nodes="Випаровування|Конденсація|Опади|Стік";title="Кругообіг"}}

      Зв'язок живої та неживої природи зручно показати діаграмою Ейлера-Венна, а склад молекули води (H₂O) — через модель атома Оксигену:
      {{venn:a="Жива природа";b="Нежива природа";both="Вода й повітря"}} {{atom_shell:element="Кисень (O)";protons=8;electrons="2|6"}}
    formulaText: "Лід (твердий) ⇄ Вода (рідка) ⇄ Пара (газувата)"
    stepByStepBreakdown:
      - "Сонце нагріває поверхню водойм → відбувається випаровування."
      - "Охолоджуючись на висоті, пара конденсується у краплини хмар і повертається опадами."
    copilotHint: "Зверніть увагу, що навіть у монохромній темі різні множини на діаграмі Венна легко розрізняються за штрихуванням."

  - id: "sci-03-quiz"
    type: "block_recognition_quiz"
    multiSelect: true
    question: "Оберіть УСІ процеси, які безпосередньо входять до природного кругообігу води (множинний вибір):"
    options:
      - text: "Випаровування води з морів і річок"
        isCorrect: true
        feedbackSuccess: "Так! Це перший етап підйому вологи в атмосферу."
      - text: "Конденсація пари у хмари"
        isCorrect: true
        feedbackSuccess: "Вірно! Охолоджена пара перетворюється на дрібні краплинки."
      - text: "Фотосинтез каменю"
        isCorrect: false
        feedbackFail: "Камінь належить до неживої природи і не здійснює фотосинтез."
      - text: "Випадання дощу та снігу (опади)"
        isCorrect: true
        feedbackSuccess: "Саме так — вода повертається на земну поверхню."
    explanation: "Кругообіг води складається з випаровування, конденсації, опадів та стоку."

  - id: "sci-04-somatic"
    type: "block_somatic_pause"
    activityId: "vowel_sound_flow"
    durationSec: 15
    guideVoiceText: "Уявіть тихий потік води. Зробіть глибокий вдих і спокійно видихніть зі звуками У — О — А."
    copilotHint: "Коротка дихальна пауза допомагає краще запам'ятати новий матеріал."
