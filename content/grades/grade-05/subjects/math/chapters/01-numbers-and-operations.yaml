blocks:
  - id: "math-01-fact"
    type: "fact"
    title: "Одиниці вимірювання довжини"
    text: |
      У 1 метрі міститься 100 сантиметрів (`1 м = 100 см`). Загальна ширина конструкції дорівнює сумі ширин усіх її складових елементів.

      {{compare:a=480;b=540;labelA="Ширина брами (см)";labelB="Висота арки (см)"}}
    speaker: "Будівельний майстер"
    speakerAvatar: "📐"
    hints:
      - question: "Скільки сантиметрів у 4 метрах 80 сантиметрах?"
        correctAnswer: "480"
        explanation: "4 м = 400 см. Разом: 400 см + 80 см = 480 см."

  - id: "math-02-theory-rect"
    type: "theory"
    title: "Периметр і площа прямокутної стулки"
    ruleSummary: |
      Щоб замовити правильну кількість дощок для стулки брами зі сторонами {{tangle:var=rectW;label="a";min=2;max=14;value=8;unit="м"}} та {{tangle:var=rectH;label="b";min=2;max=10;value=5;unit="м"}}, обчислюємо її периметр {{scope_expr:expr="2*(rectW+rectH)";label="P";unit="м"}} і площу {{scope_expr:expr="rectW*rectH";label="S";unit="м²"}}. Потягніть будь-яке число прямо в тексті або скористайтесь кнопкою «Змінити» під кресленням!

      {{rect_geo:w=8;h=5;varW=rectW;varH=rectH;unit="м"}}

      {{tape:parts="160|160|160";labels="Ліва (160 см)|Стовпи/зазор (160 см)|Права (160 см)";whole="Повна ширина 480 см"}}

      {{axis:min=0;max=10;start=2;jump=5}} {{grid:rows=3;cols=4;points="1:2|3:1"}}
    formulaText: "P = 2 · (a + b)   |   S = a · b"
    stepByStepBreakdown:
      - "Переведіть метри у сантиметри (1 м = 100 см), щоб усі виміри були в одних одиницях."
      - "Для прямокутника зі сторонами a та b: P = 2 · (a + b), S = a · b."
    copilotHint: "Скористайтеся повзунками під прямокутником, щоб перевірити, як зміна ширини впливає на площу S і периметр P."

  - id: "math-03-vars-warmup"
    type: "block_notebook_task"
    title: "Розминка майстра (індивідуальний розрахунок)"
    vars:
      leafCm: "randInt(14, 18) * 10"
      frameCm: "randInt(8, 12) * 10"
      totalCm: "leafCm * 2 + frameCm"
    notebookPrompt: |
      Для додаткової хвіртки кожна з двох однакових стулок має ширину **{{leafCm}} см**, а центральний просвіт і бічні опори разом додають **{{frameCm}} см**.

      Обчисліть повну ширину конструкції в сантиметрах:
    unit: "см"
    correctAnswer: "{{totalCm}}"
    hint: "Помножте ширину однієї стулки ({{leafCm}} см) на 2 та додайте {{frameCm}} см."
    copilotHint: "Запишіть дію в чернетку: {{leafCm}} · 2 + {{frameCm}}."

  - id: "quest-timber-gate"
    type: "blueprint_task"
    blueprintId: "timber-gate"
    blueprintMode: "progressive"
    title: "Поетапний розрахунок Захисної Брами"
    text: |
      На кресленні приховані два підсумкові виміри (`? см`). Розкрийте їх послідовно: спочатку обчисліть повну ширину брами з відомих сегментів, а на основі отриманого результату — висоту арки.
    calculationSteps:
      - id: "step-total-width"
        fieldKey: "totalWidthCm"
        label: "Повна ширина брами"
        prompt: "Крок 1 із 2. Додайте всі нижні сегменти креслення: дві бічні балки (по 30 см), ліву стулку (160 см), центральний просвіт (100 см) і праву стулку (160 см). Яка загальна ширина брами?"
        correctAnswer: "480"
        unit: "см"
        hint: "Складіть усі п’ять горизонтальних відрізків: 30 + 160 + 100 + 160 + 30."
      - id: "step-arch-height"
        fieldKey: "archHeightCm"
        label: "Висота арки"
        prompt: "Крок 2 із 2. Повна ширина брами (480 см) тепер відкрита на кресленні! За технічним завданням висота арки перевищує повну ширину рівно на 60 см. Обчисліть висоту арки:"
        correctAnswer: "540"
        unit: "см"
        hint: "Додайте 60 см до відкритої на кресленні повної ширини (480 см): 480 + 60."
    correctAnswer: "480"
    copilotHint: "Розкривайте параметри крок за кроком: знайдене значення одразу з’явиться на кресленні і стане основою для наступного розрахунку."
    hints:
      - question: "Чому дорівнює сума двох бічних балок (по 30 см) та аркового просвіту (100 см)?"
        correctAnswer: "160"
        explanation: "30 + 30 + 100 = 160 см. Додавши дві стулки по 160 см, отримаємо 480 см."

  - id: "math-05-logic-audit"
    type: "block_logic_review"
    blueprintId: "timber-gate"
    title: "Логічний аудит: перевірка запису підмайстра"
    claimedLabel: "Запис підмайстра у журналі"
    claimedValue: "Повна ширина брами = 420 см"
    scenarioPrompt: |
      На цьому кресленні **всі розміри відкриті** перед вами. Підмайстер вніс у кошторис, що загальна ширина брами становить **420 см**, і просить погодити закупівлю балок під цей розмір.

      Уважно звірте запис із кресленням та ухваліть рішення:
    expectedVerdict: "error_found"
    verdictOptions:
      - id: "already_solved"
        label: "✅ Запис точний (420 см) — додаткові обчислення не потрібні"
      - id: "error_found"
        label: "⚠️ У записі є суперечність/помилка — дані на кресленні інші"
      - id: "missing_data"
        label: "❓ На кресленні бракує розмірів, перевірити запис неможливо"
    followUpQuestion: "Вкажіть правильну загальну ширину брами, зафіксовану на кресленні:"
    followUpAnswer: "480"
    followUpUnit: "см"
    explanation: "Критична перевірка врятувала замовлення! На кресленні чітко видно: 30 + 160 + 100 + 160 + 30 = 480 см, тож запис «420 см» містить помилку."
    hint: "Порівняйте верхній габаритний розмір та суму нижніх сегментів креслення із записом «420 см»."
    copilotHint: "Спочатку перевіряйте, чи справді дані узгоджуються між собою, і не приймайте помилковий запис без аудиту."
